name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -fsSLo gitleaks.tar.gz "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLo checksums.txt "$base/gitleaks_8.30.1_checksums.txt"
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' checksums.txt)
          test -n "$expected"
          echo "$expected  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan Git history
        run: gitleaks git . --redact --no-banner
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --frozen
      - run: uv run pytest --no-cov -q
      - run: python -m py_compile macos-panel/panel.py
      - run: bash -n macos-panel/keep-tabs-alive.sh macos-panel/launch-panel.sh
      - run: bash macos-panel/tests/keep-tabs-alive-test.sh
